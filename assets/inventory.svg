<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Tech inventory: Languages, Core CS, AI and ML, Frameworks, Data stores, Tools and libraries.">
  <title>Tech Inventory — Gagandeep N</title>

  <defs>
