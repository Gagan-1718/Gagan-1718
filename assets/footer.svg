<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="End of transmission — thanks for visiting.">
  <title>End of transmission</title>

  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <radialGradient id="fAura" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="160" fill="url(#fBg)"/>
  <ellipse cx="600" cy="160" rx="620" ry="130" fill="url(#fAura)"/>

  <!-- horizon skyline echo -->
  <g fill="#0D141C" opacity="0.9">
    <rect x="60" y="120" width="52" height="40"/>  <rect x="120" y="134" width="30" height="26"/>
    <rect x="164" y="112" width="44" height="48"/> <rect x="220" y="138" width="26" height="22"/>
    <rect x="900" y="128" width="34" height="32"/> <rect x="944" y="112" width="48" height="48"/>
    <rect x="1000" y="136" width="28" height="24"/><rect x="1040" y="122" width="44" height="38"/>
  </g>
  <g fill="#22D3EE" opacity="0.4">
    <rect x="60" y="120" width="52" height="1.2"/>  <rect x="164" y="112" width="44" height="1.2"/>
    <rect x="944" y="112" width="48" height="1.2"/> <rect x="1040" y="122" width="44" height="1.2"/>
  </g>

  <!-- rails (split so the title sits in the gap) -->
  <rect x="0" y="46" width="424" height="1.4" fill="url(#fLine)"/>
  <rect x="776" y="46" width="424" height="1.4" fill="url(#fLine)"/>
  <rect x="-180" y="45.4" width="180" height="2.6" rx="1.3" fill="url(#fSweep)" filter="url(#fGlow)">
    <animate attributeName="x" values="-180;1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- hex marks -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2">
    <path d="M436 40 L446 46 L446 58 L436 64 L426 58 L426 46 Z"/>
    <path d="M764 40 L774 46 L774 58 L764 64 L754 58 L754 46 Z"/>
  </g>
  <g fill="#A855F7">
    <circle cx="436" cy="52" r="2.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="764" cy="52" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="6" fill="#67E8F9" filter="url(#fGlow)">END OF TRANSMISSION</text>
  <text x="600" y="92" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2.4" fill="#8B95A7">Thanks for visiting — let's build something worth shipping.</text>

  <g>
    <circle cx="468" cy="118" r="4" fill="#3BFFA1">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="484" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2.6" fill="#5D6B7E">SESSION ACTIVE · STANDING BY</text>
  </g>

  <g fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1">
    <path d="M300 52 h60 M340 46 l10 6 l-10 6"/>
    <path d="M900 52 h-60 M860 46 l-10 6 l10 6"/>
  </g>
</svg>
